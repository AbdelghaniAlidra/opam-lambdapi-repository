name: Artifact example

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Créer un fichier
        run: |
          mkdir path1
          mkdir path2
          touch path1/opam
          touch path2/opam
          files=$(find . -type f -name "opam" -exec dirname {} \;)
          echo $files > message.txt
          
          #           json=$(printf '%s\n' "$files" | jq -R . | jq -s '{include: map({lib: .})}')

      - name: Uploader l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-fichier
          path: message.txt

  consume:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        ocaml_version: [5.4.0, 5.3.0]
    steps:
      - name: Télécharger l'artifact
        uses: actions/download-artifact@v4
        with:
          name: mon-fichier

      - name: Lire le fichier
        run: |
          libs=$(cat message.txt)
          json=$(printf '%s\n' "$libs" | jq -R . | jq -s '{include: map({lib: . , ocaml_version: "${{matrix.ocaml_version}}"})}')
          echo $json



